<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SpeedNote{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('annees.liste') }}">SpeedNote</a>
  {% if store_unlocked %}
  <form method="post" action="{{ url_for('auth.verrouiller') }}" class="lock-form">
    <button type="submit">Verrouiller</button>
  </form>
  {% endif %}
</header>
<main>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <ul class="flash">
      {% for m in messages %}<li>{{ m }}</li>{% endfor %}
      </ul>
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
