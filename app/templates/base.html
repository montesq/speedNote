<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SpeedNote{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%92%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar navbar-expand navbar-light bg-white border-bottom mb-4">
  <div class="container-fluid">
    <a class="navbar-brand fw-semibold" href="{{ url_for('accueil.index') if store_unlocked else url_for('auth.deverrouiller') }}">
      🎒 SpeedNote
    </a>
    {% if store_unlocked %}
    <div class="ms-auto d-flex align-items-center gap-2">
      <a href="{{ url_for('annees.liste') }}" class="btn btn-outline-secondary btn-sm">⚙️ Admin</a>
      <form method="post" action="{{ url_for('auth.verrouiller') }}" class="m-0">
        <button type="submit" class="btn btn-outline-danger btn-sm">🔒 Verrouiller</button>
      </form>
    </div>
    {% endif %}
  </div>
</nav>
<main class="{% block main_class %}container{% endblock %} pb-5">
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for m in messages %}
      <div class="alert alert-success">{{ m }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3" style="z-index: 1080;" id="toast-container" aria-live="polite"></div>
<script src="{{ url_for('static', filename='vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>
<script src="{{ url_for('static', filename='toast.js') }}"></script>
</body>
</html>
