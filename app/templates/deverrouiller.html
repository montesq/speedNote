{% extends "base.html" %}
{% block title %}Déverrouiller — SpeedNote{% endblock %}
{% block content %}
<h1>🔒 SpeedNote est verrouillé</h1>
{% if error %}<p class="text-danger fw-semibold">{{ error }}</p>{% endif %}
<form method="post">
  <div class="mb-3">
    <label class="form-label">Mot de passe</label>
    <input type="password" class="form-control" name="passphrase" required autofocus>
  </div>
  <button type="submit" class="btn btn-primary">🔓 Déverrouiller</button>
</form>
{% endblock %}
