{% extends "base.html" %}
{% block title %}Années scolaires — SpeedNote{% endblock %}
{% block content %}
<h1>🎓 Années scolaires</h1>
<form method="post" class="d-flex flex-wrap gap-2 mb-3">
  <input type="text" class="form-control" style="max-width: 16rem;" name="libelle" placeholder="ex. 2025-2026" required>
  <button type="submit" class="btn btn-primary">➕ Ajouter</button>
</form>
<ul class="list-group">
  {% for annee in annees %}
  <li class="list-group-item d-flex align-items-center gap-2">
    <a href="{{ url_for('classes.liste', annee_id=annee['id']) }}" class="flex-grow-1">📅 {{ annee['libelle'] }}</a>
    <form method="post" action="{{ url_for('annees.supprimer', annee_id=annee['id']) }}"
          onsubmit="return confirm('Supprimer cette année et toutes ses classes/élèves/devoirs ?');">
      <button type="submit" class="btn btn-outline-danger">Supprimer</button>
    </form>
  </li>
  {% else %}
  <li class="list-group-item text-body-secondary">Aucune année scolaire pour le moment.</li>
  {% endfor %}
</ul>
{% endblock %}
